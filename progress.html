<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workshop Progress</title>
<!-- Your workshop progress. Open this file in a browser. The workshop-progress skill writes progress.data.js next to it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap">
<style>
/* Black Lab Studios tokens, vendored from blacklabstudios.com (tokens/ + the site's dark theme and muted-text fix).
   House style: a spec sheet. Hairline rules carry the structure, metadata sits in the margins, numbers are tabular.
   Foundation palette for everything; the extension palette only for status, always with Charcoal text. */
:root{
  --color-charcoal:#1A1A1A;--color-charcoal-80:#484848;--color-charcoal-60:#757575;--color-charcoal-40:#A3A3A3;--color-charcoal-20:#D1D1D1;
  --color-white:#FFFFFF;--color-off-white:#F6F4F1;--color-pampas:#DDD8C4;
  --color-rock:#BAC7E1;--color-warm-clay-40:#E3C9B7;--color-meadow-mist:#ACB99A;--color-meadow-mist-20:#EEF1EB;--color-warm-clay:#BA784B;--color-warm-clay-20:#F1E4DB;--color-lavender:#B7B6C1;--color-lavender-20:#F1F0F3;

  --surface-page:var(--color-off-white);--surface-card:var(--color-white);--surface-sunken:var(--color-pampas);
  --surface-inverse:var(--color-charcoal);
  --text-primary:var(--color-charcoal);--text-secondary:var(--color-charcoal-80);--text-muted:var(--color-charcoal-80);
  --text-on-inverse:var(--color-white);--text-on-inverse-muted:rgba(255,255,255,.7);
  --border-hairline:var(--color-charcoal-20);--border-strong:var(--color-charcoal-40);
  --action-primary-bg:var(--color-charcoal);--action-primary-fg:var(--color-white);--action-ghost-bg-hover:rgba(26,26,26,.06);
  --focus-ring:var(--color-charcoal);
  --status-done:var(--color-meadow-mist);--status-now:var(--color-warm-clay);--status-next:var(--color-lavender);--status-info:var(--color-rock);
  --status-done-soft:var(--color-meadow-mist-20);--status-now-soft:var(--color-warm-clay-20);--status-next-soft:var(--color-lavender-20);
  --status-fg:var(--color-charcoal);
  --code-bg:var(--color-charcoal);--code-fg:#ECEAE6;

  --font-sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius-sm:2px;--radius-md:4px;
  --space-half:4px;--space-xs:8px;--space-s:16px;--space-m:24px;--space-l:32px;--space-xl:48px;--space-xxl:64px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --surface-page:var(--color-charcoal);--surface-card:color-mix(in srgb,var(--color-white) 6%,var(--color-charcoal));--surface-sunken:#101010;
  --surface-inverse:var(--color-off-white);
  --text-primary:var(--color-white);--text-secondary:rgba(255,255,255,.72);--text-muted:rgba(255,255,255,.72);
  --text-on-inverse:var(--color-charcoal);--text-on-inverse-muted:rgba(26,26,26,.72);
  --border-hairline:rgba(255,255,255,.16);--border-strong:rgba(255,255,255,.32);
  --action-primary-bg:var(--color-white);--action-primary-fg:var(--color-charcoal);--action-ghost-bg-hover:rgba(255,255,255,.08);
  --focus-ring:var(--color-white);
  --status-done-soft:rgba(172,185,154,.16);--status-now-soft:rgba(186,120,75,.18);--status-next-soft:rgba(183,182,193,.12);
  --code-bg:#101010;--code-fg:#ECEAE6;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-page:var(--color-charcoal);--surface-card:color-mix(in srgb,var(--color-white) 6%,var(--color-charcoal));--surface-sunken:#101010;
  --surface-inverse:var(--color-off-white);
  --text-primary:var(--color-white);--text-secondary:rgba(255,255,255,.72);--text-muted:rgba(255,255,255,.72);
  --text-on-inverse:var(--color-charcoal);--text-on-inverse-muted:rgba(26,26,26,.72);
  --border-hairline:rgba(255,255,255,.16);--border-strong:rgba(255,255,255,.32);
  --action-primary-bg:var(--color-white);--action-primary-fg:var(--color-charcoal);--action-ghost-bg-hover:rgba(255,255,255,.08);
  --focus-ring:var(--color-white);
  --status-done-soft:rgba(172,185,154,.16);--status-now-soft:rgba(186,120,75,.18);--status-next-soft:rgba(183,182,193,.12);
  --code-bg:#101010;--code-fg:#ECEAE6;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:28px;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,p,ul,ol{margin:0}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit}
code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-sunken);padding:1px 5px;border-radius:var(--radius-sm)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}

.wrap{max-width:1180px;margin:0 auto;padding-block:var(--space-l) var(--space-xxl);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:var(--space-l)}

/* Masthead */
.mast{display:flex;justify-content:space-between;align-items:center;gap:var(--space-s);flex-wrap:wrap;border-bottom:2px solid var(--text-primary);padding-bottom:var(--space-s)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:28px;height:28px;flex:none}
.brand .eyebrow{color:var(--text-primary)}
.meta{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12px;line-height:16px;color:var(--text-muted)}
.meta b{color:var(--text-primary);font-weight:600}

/* Hero: the one number that matters */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-l);align-items:end}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.1;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.hero p{color:var(--text-secondary);max-width:58ch;margin-top:var(--space-xs)}
.count{display:grid;gap:var(--space-xs)}
.count .n{font-size:56px;line-height:1;font-weight:300;letter-spacing:-.02em}
.count .n small{font-size:20px;color:var(--text-muted);font-weight:400;letter-spacing:0}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cells i{height:10px;background:var(--border-hairline)}
.cells i.done{background:var(--text-primary)}
.cells i.now{background:var(--status-now)}
.upnext{display:flex;justify-content:space-between;align-items:center;gap:var(--space-s);flex-wrap:wrap;border:1px solid var(--text-primary);padding:12px var(--space-s);text-decoration:none;transition:background var(--fast) var(--ease)}
.upnext:hover{background:var(--action-ghost-bg-hover)}
.upnext span{font-weight:600}
.note{font-size:14px;line-height:20px;color:var(--text-muted)}

/* Status chip: extension colour, Charcoal text, squared */
.chip{display:inline-block;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:var(--radius-sm);color:var(--status-fg);white-space:nowrap}
.chip.done{background:var(--status-done)}.chip.started{background:var(--status-now)}.chip.now{background:var(--status-now)}.chip.next{background:var(--status-next)}.chip.kind{background:var(--status-info)}

/* Overview: one ruled row per pillar */
.sheet{display:grid}
.row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--space-m);padding-block:var(--space-m);border-top:1px solid var(--border-hairline)}
.row:last-child{border-bottom:1px solid var(--border-hairline)}
@media (max-width:720px){.row{grid-template-columns:minmax(0,1fr);gap:var(--space-s)}}
.row h2{font-size:20px;line-height:28px;font-weight:600}
.row .what{font-size:14px;line-height:20px;color:var(--text-muted);margin-top:4px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-xs)}
.item{display:grid;gap:6px;align-content:start;text-align:left;text-decoration:none;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px 14px;transition:border-color var(--fast) var(--ease)}
.item:hover{border-color:var(--text-primary)}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .code{font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--text-muted)}
.item .t{font-weight:600;line-height:22px}
.item.now,.item.started{border-color:var(--status-now);box-shadow:inset 3px 0 0 var(--status-now)}
.item.side{background:transparent;border-style:dashed}
.item .bar{height:3px;background:var(--border-hairline);margin-top:2px}
.item .bar b{display:block;height:100%;background:var(--text-primary)}

/* Exercise view */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:var(--space-s);flex-wrap:wrap;font-size:14px;line-height:20px}
.crumbs nav{display:flex;gap:8px;flex-wrap:wrap;color:var(--text-muted)}
.crumbs nav a{color:var(--text-primary);font-weight:600}
.pager{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;font-weight:600;text-decoration:none;border:1px solid var(--text-primary);border-radius:var(--radius-sm);padding:6px 12px;background:transparent;cursor:pointer}
.btn:hover{background:var(--action-ghost-bg-hover)}
.btn.primary{background:var(--action-primary-bg);color:var(--action-primary-fg)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.head{display:grid;gap:var(--space-xs);border-bottom:2px solid var(--text-primary);padding-bottom:var(--space-m)}
.head h1{font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.01em;font-weight:600;text-wrap:balance}
.head .goal{font-size:18px;line-height:28px;color:var(--text-secondary);max-width:66ch}
.head .status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;line-height:20px;color:var(--text-muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--space-xl);align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.main,.aside{display:grid;gap:var(--space-l);min-width:0}
section h2{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text-muted);margin-bottom:var(--space-s);display:flex;justify-content:space-between;gap:8px}
.take{list-style:none;padding:0;display:grid;counter-reset:t}
.take li{display:grid;grid-template-columns:32px minmax(0,1fr);padding-block:10px;border-top:1px solid var(--border-hairline);counter-increment:t}
.take li::before{content:counter(t,decimal-leading-zero);font-family:var(--font-mono);font-size:12px;color:var(--text-muted);padding-top:2px}
.take li:last-child{border-bottom:1px solid var(--border-hairline)}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 0;overflow-x:auto}
.node{display:grid;align-content:start;gap:2px;padding:10px 12px;border:1px solid var(--border-hairline);background:var(--surface-card);min-width:110px;max-width:200px}
.node .l{font-weight:600;font-size:14px;line-height:20px}
.node .d{font-size:12px;line-height:16px;color:var(--text-muted)}
.node.hot{border-color:var(--text-primary);background:var(--surface-inverse);color:var(--text-on-inverse)}
.node.hot .d{color:var(--text-on-inverse-muted)}
.node.hot code{background:transparent;color:inherit;padding:0}
.arrow{align-self:center;padding:0 6px;color:var(--text-muted)}

.steps{list-style:none;padding:0;display:grid}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-block:var(--space-s);border-top:1px solid var(--border-hairline)}
.step:last-child{border-bottom:1px solid var(--border-hairline)}
.step input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--text-primary);cursor:pointer}
.step .st{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step .num{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
.step .tt{font-weight:600}
.step.ticked .tt{text-decoration:line-through;text-decoration-color:var(--border-strong)}
.step .lead{font-size:15px;line-height:24px;color:var(--text-secondary);margin-top:4px;max-width:68ch}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.file{font-family:var(--font-mono);font-size:12px;line-height:16px;padding:3px 8px;border:1px solid var(--border-hairline);border-radius:var(--radius-sm);background:var(--surface-card)}
details.code{margin-top:10px}
details.code summary{cursor:pointer;font-size:13px;line-height:20px;color:var(--text-muted);font-weight:500}
pre{margin:8px 0 0;background:var(--code-bg);color:var(--code-fg);font-family:var(--font-mono);font-size:12.5px;line-height:1.6;padding:14px;border-radius:var(--radius-md);overflow-x:auto;white-space:pre}
.extras{font-size:14px;line-height:20px;color:var(--text-muted)}

.ladder{list-style:none;padding:0;display:grid}
.ladder li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding-block:8px;border-top:1px solid var(--border-hairline);font-size:14px;line-height:20px}
.ladder li:last-child{border-bottom:1px solid var(--border-hairline)}
.mk{display:grid;place-items:center;width:20px;height:20px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;color:var(--status-fg)}
.m2{background:var(--status-done)}.m1{background:var(--status-now)}.m0{background:var(--status-next)}
.ladder li.m-0{color:var(--text-muted)}
.fixes{display:grid}
.fix{padding-block:10px;border-top:1px solid var(--border-hairline);display:grid;gap:4px;font-size:14px;line-height:20px}
.fix:last-child{border-bottom:1px solid var(--border-hairline)}
.fix .sy{font-weight:600}
.fix .fx{color:var(--text-secondary)}
.card{border:1px solid var(--border-hairline);background:var(--surface-card);padding:var(--space-s);display:grid;gap:10px;font-size:14px;line-height:20px}
.card code{word-break:break-all}
.foot{font-size:12px;line-height:16px;color:var(--text-muted);border-top:1px solid var(--border-hairline);padding-top:var(--space-s)}

/* Exercise page, organised like the student's version: takeaways, mini flow, collapsible steps, three boxes, branch commands */
.takebox{border:2px solid var(--text-primary);padding:var(--space-s) var(--space-m);background:var(--surface-card)}
.takebox h2,.box h2,.sh{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text-muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.takebox .take li{border-top:0;padding-block:6px}
.takebox .take li:last-child{border-bottom:0}
.fstrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;padding:12px;border:1px solid var(--border-hairline);background:var(--surface-card)}
.fnode{display:grid;justify-items:center;text-align:center;gap:0;padding:8px 10px;border:1px solid var(--border-hairline);background:var(--surface-page);min-width:92px;max-width:170px}
.fnode .l{font-weight:600;font-size:13px;line-height:18px}
.fnode .d{font-size:11.5px;line-height:15px;color:var(--text-muted)}
.fnode.hot{background:var(--surface-inverse);color:var(--text-on-inverse);border-color:var(--surface-inverse)}
.fnode.hot .d{color:var(--text-on-inverse-muted)}
.fnode code{background:transparent;padding:0;color:inherit}
.farrow{padding:0 6px;color:var(--text-muted)}
.slist{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.srow > input{width:18px;height:18px;margin:16px 0 0;accent-color:var(--text-primary);cursor:pointer}
details.sd{border:1px solid var(--border-hairline);background:var(--surface-card);min-width:0}
details.sd[open]{border-color:var(--text-primary)}
details.sd summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
details.sd summary::-webkit-details-marker{display:none}
.num{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--border-strong);font-size:12px;font-weight:600}
.ticked .num{background:var(--status-done);border-color:var(--status-done);color:var(--status-fg)}
.stt{display:grid;min-width:0}
.stt b{font-weight:600;line-height:22px}
.stt small{font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--text-muted);overflow-wrap:anywhere}
.ticked .stt b{text-decoration:line-through;text-decoration-color:var(--border-strong)}
.caret{color:var(--text-muted);transition:transform var(--fast) var(--ease);font-size:18px}
details[open] .caret{transform:rotate(90deg)}
.sbody{display:grid;gap:10px;padding:0 12px 14px 50px;min-width:0}
@media (max-width:560px){.sbody{padding-left:12px}}
.sbody .lead{font-size:15px;line-height:24px;color:var(--text-secondary);margin:0}
.pts{margin:0;padding-left:18px;display:grid;gap:2px;font-size:14px;line-height:22px}
.sbody pre{margin:0}
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-s);align-items:start}
@media (max-width:720px){.boxes{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--border-hairline);background:var(--surface-card);padding:var(--space-s);display:grid;gap:4px;min-width:0}
.term{display:grid;font-family:var(--font-mono);font-size:12.5px;line-height:1.65;background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:var(--radius-md);white-space:pre-wrap;overflow-wrap:anywhere}
.box.wide{grid-column:1/-1}
.term .in{color:var(--color-warm-clay-40,#E3C9B7)}
.box .fix{border-top:0;padding-block:6px}
.box .fix .sy{font-family:var(--font-mono);font-size:12.5px;font-weight:500;background:var(--status-now-soft);padding:2px 6px;justify-self:start}
.box .note{font-size:13px;color:var(--text-muted)}
.jump{display:grid;gap:8px;border-top:1px solid var(--border-hairline);padding-top:var(--space-s);font-size:14px;line-height:20px}
.jl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.jk{color:var(--text-muted)}
.jump a{text-decoration:none}
.watch{margin:0;padding:8px 12px 8px 28px;border-left:3px solid var(--status-now);background:var(--status-now-soft);font-size:14px;line-height:20px;display:grid;gap:2px}
.sub{display:grid;gap:4px}
.subt{margin:0;font-size:13px;line-height:18px;font-weight:600}
.stepl{font-size:13px;line-height:18px;font-weight:600;text-decoration:none;justify-self:start}
.stepl:hover{text-decoration:underline}
.skip{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--status-next);color:var(--status-fg);padding:1px 6px;border-radius:var(--radius-sm);margin-left:6px;vertical-align:middle}
.cu{font-size:12px;line-height:16px;color:var(--text-muted)}
.md{display:grid;gap:10px;min-width:0;font-size:15px;line-height:24px}
.md > *{margin:0}
.md h3,.md h4,.md h5{font-size:14px;line-height:20px;font-weight:600;margin-top:6px}
.md ul,.md ol{margin:0;padding-left:22px;display:grid;gap:4px}
.md li > ul,.md li > ol{margin-top:4px}
.md blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--status-now);background:var(--status-now-soft);display:grid;gap:8px}
.md blockquote > *{margin:0}
.md pre{margin:0}
.md hr{border:0;border-top:1px solid var(--border-hairline);margin:4px 0}
.md a{text-underline-offset:3px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:14px;line-height:20px}
.tbl th,.tbl td{border:1px solid var(--border-hairline);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-sunken)}
pre code{background:none;padding:0;color:inherit;font-size:inherit;border-radius:0}
.sbody,.md{grid-template-columns:minmax(0,1fr)}
.md pre,.md .tbl{max-width:100%}
code{overflow-wrap:anywhere}
pre code{overflow-wrap:normal}
.head .status span{min-width:0;overflow-wrap:anywhere}
details.before{border:1px solid var(--border-strong);background:var(--surface-card);padding:0}
details.before > summary{cursor:pointer;padding:10px 14px;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}
details.before > .md{padding:0 14px 14px}
.fxlist{display:grid}
details.fx{border-top:1px solid var(--border-hairline)}
details.fx:last-child{border-bottom:1px solid var(--border-hairline)}
details.fx > summary{cursor:pointer;padding:8px 0;font-size:14px;line-height:20px;font-weight:600}
details.fx > .md{padding:0 0 12px}
.ladder{display:block;columns:2 260px;column-gap:24px}
.ladder li{break-inside:avoid}
.md ul,.md ol{grid-template-columns:minmax(0,1fr)}
.md li{min-width:0}
.look{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--text-secondary)}
.warnbar{margin:0;background:var(--status-now-soft);border-left:3px solid var(--status-now);padding:10px 14px;font-size:14px;line-height:20px}
.did{margin:0;display:grid;gap:2px;font-size:14px;line-height:20px;background:var(--status-done-soft);border-left:3px solid var(--status-done);padding:8px 12px}
.box.agent{border-color:var(--status-done)}
.empty{display:grid;gap:var(--space-s);max-width:62ch;padding-block:var(--space-xl)}
.empty h1{font-size:clamp(32px,5vw,48px);line-height:1.1;letter-spacing:-.02em;font-weight:600}
.empty p{color:var(--text-secondary)}
.srow > input:disabled{cursor:default;opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const DATA = window.WORKSHOP_PROGRESS || null;
// Ticks and the coding agent's notes live in progress.json, which the skill folds into progress.data.js.
// The page only reads them.
const app = document.getElementById("app");
if (!DATA) {
  app.innerHTML = `<header class="mast"><span class="brand"><span aria-hidden="true">${document.getElementById("logo").innerHTML}</span><span class="eyebrow">Black Lab Studios · Build Your First AI Agent in .NET</span></span></header>
  <section class="empty"><div class="eyebrow">Finance Assistant workshop</div><h1>No progress loaded yet</h1>
    <p>Ask your coding agent to run the <code>workshop-progress</code> skill, then refresh this page. In Claude Code, type <code>/workshop-progress</code>.</p>
    <p>No coding agent? From the repo root, run <code>dotnet run .agents/skills/workshop-progress/scripts/Progress.cs</code>, then refresh.</p></section>`;
} else {
const P = JSON.parse(DATA.progress || "{}");
const saved = g => P[g.id] || {};
const stepSaved = (g, k) => ((saved(g).steps || {})[k + 1]) || {};

const G = DATA.guides, byId = Object.fromEntries(G.map(g => [g.id, g]));
const core = G.filter(g => g.kind === "core");
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const tickKey = (g, i) => `${g.id}:${i}`;
const isTicked = (g, i) => !!stepSaved(g, i).done;
const tickedCount = g => g.steps.filter((_, i) => isTicked(g, i)).length;
// The tool decides each exercise's state: the coding agent's verdict when it has one, the code otherwise.
const isDone = g => g.state === "done";
const nowId = (core.find(g => !isDone(g)) || {}).id;
const statusOf = g => isDone(g) ? "done" : g.state === "started" ? "started" : g.id === nowId ? "now" : "next";
// The step to use in the "tell your agent" hint: one the repo can't show, so the example makes sense.
const hintStep = g => {
  if (isDone(g)) return null;
  const k = g.steps.findIndex((x, i) => (x.where === "Azure portal" || x.run) && !isTicked(g, i) && stepSaved(g, i).skipped !== true && !saved(g).caughtUp);
  return k < 0 ? null : k + 1;
};
const LABEL = { done: "Done", started: "In progress", now: "Up next", next: "Not started" };
const KIND = { bonus: "Bonus", demo: "Demo" };
const logo = document.getElementById("logo").innerHTML;

function masthead() {
  return `<header class="mast">
    <a class="brand" href="#" data-go=""><span aria-hidden="true">${logo}</span><span class="eyebrow">Black Lab Studios · Build Your First AI Agent in .NET</span></a>
    <div class="meta tab"><span>Branch <b>${esc(DATA.branch || "unknown")}</b></span><span>Updated <b>${esc(DATA.generatedAt)}</b></span></div>
  </header>`;
}

function banner() {
  return DATA.progressError ? `<p class="warnbar">${esc(DATA.progressError)}</p>` : "";
}

function overview() {
  const done = core.filter(isDone).length, next = byId[nowId];
  const cells = core.map(g => `<i class="${isDone(g) ? "done" : statusOf(g) === "started" || g.id === nowId ? "now" : ""}" title="${esc(g.code)}"></i>`).join("");
  const rows = DATA.pillars.map(p => {
    const items = G.filter(g => g.pillar === p.id);
    return `<div class="row">
      <div><div class="eyebrow">${esc(p.id)}</div><h2>${esc(p.name)}</h2><p class="what">${esc(p.what)}</p></div>
      <div class="items">${items.map(card).join("")}</div>
    </div>`;
  }).join("");
  return `${masthead()}${banner()}
  <section class="hero">
    <div><div class="eyebrow">Finance Assistant workshop</div><h1>Your progress, read from your code</h1>
      <p>Your coding agent marks an exercise done once it has checked your work against the guide. Until then, files in your working tree show it as in progress. To update this page, ask your coding agent to run the <code>workshop-progress</code> skill, then hard refresh.</p></div>
    <div class="count">
      <div class="n tab">${done}<small> / ${core.length} core exercises</small></div>
      <div class="cells" aria-hidden="true">${cells}</div>
      ${next ? `<a class="upnext" href="#${next.id}"><span>Up next: ${esc(next.code)} ${esc(next.title)}</span><span aria-hidden="true">→</span></a>`
             : `<p class="note">Every core exercise is in your code. Try a bonus or a demo.</p>`}
    </div>
  </section>
  <div class="sheet">${rows}</div>
  <p class="foot">Built from the guides in <code>docs/</code> by the <code>workshop-progress</code> skill. Ticks and your coding agent's notes are kept in <code>progress.json</code>.</p>`;
}

function card(g) {
  const s = statusOf(g), side = g.kind !== "core";
  const pct = g.steps.length ? Math.round(100 * tickedCount(g) / g.steps.length) : 0;
  const chip = side && s !== "done" && s !== "started" ? `<span class="chip kind">${KIND[g.kind]}</span>` : `<span class="chip ${s}">${LABEL[s]}</span>`;
  return `<a class="item ${side ? "side" : s}" href="#${g.id}">
    <span class="top"><span class="code">${esc(g.code)}</span>${chip}</span>
    <span class="t">${esc(g.title)}</span>${saved(g).caughtUp ? `<span class="cu">Caught up from <code>${esc(saved(g).caughtUp)}</code></span>` : ""}
    <span class="bar" aria-hidden="true"><b style="width:${isDone(g) ? 100 : pct}%"></b></span>
  </a>`;
}

function exercise(g) {
  const i = G.indexOf(g), prev = G[i - 1], next = G[i + 1];
  const s = statusOf(g), p = DATA.pillars.find(x => x.id === g.pillar);
  const chip = g.kind !== "core" && s !== "done" && s !== "started" ? `<span class="chip kind">${KIND[g.kind]}</span>` : `<span class="chip ${s}">${LABEL[s]}</span>`;
  const dot = t => esc(String(t || "").trim().replace(/[.\s]+$/, "")) + ".";
  const why = g.decidedBy === "agent"
    ? `Your coding agent: ${dot(saved(g).evidence || (isDone(g) ? "checked and marked it done" : "still in progress"))} From your code: ${dot(g.codeEvidence)}`
    : dot(g.codeEvidence) + (s === "started" ? " Run the skill when you finish, and your coding agent will check it." : "");
  const caught = saved(g).caughtUp;
  const tickLine = caught ? "" : `${tickedCount(g)} of ${g.steps.length} steps ticked`;
  const firstOpen = g.steps.findIndex((_, k) => !isTicked(g, k));

  const flow = g.flow.map((n, k) => `${k ? '<span class="farrow" aria-hidden="true">→</span>' : ""}<div class="fnode ${n.hot ? "hot" : ""}"><span class="l">${n.label}</span><span class="d">${n.detail}</span></div>`).join("");

  const steps = g.steps.map((st, k) => {
    const on = isTicked(g, k), note = stepSaved(g, k).note, skipped = !on && stepSaved(g, k).skipped === true;
    const fromBranch = !on && !skipped && !!saved(g).caughtUp;
    const sub = esc(st.where || "");
    return `<div class="srow ${on ? "ticked" : ""}">
      <input type="checkbox" id="t-${g.id}-${k}" data-tick="${tickKey(g, k)}" ${on ? "checked" : ""} disabled title="Your coding agent ticks this when it has checked the step" aria-label="Step ${k + 1} done">
      <details class="sd" data-k="${tickKey(g, k)}" ${k === firstOpen && s !== "done" ? "open" : ""}>
        <summary><span class="num tab">${k + 1}</span><span class="stt"><b>${st.title}${skipped ? ' <em class="skip">Skipped</em>' : fromBranch ? ' <em class="skip">From the branch</em>' : ""}</b><small>${sub}</small></span><span class="caret" aria-hidden="true">›</span></summary>
        <div class="sbody">
          ${note ? `<p class="did"><span class="eyebrow">What you did</span>${esc(note)}</p>` : ""}
          <div class="md">${st.html}</div>
          <a class="stepl" href="${esc(g.guideUrl)}${g.onGitHub ? "#" + esc(st.anchor) : ""}" target="_blank" rel="noopener">Open this step in the guide ↗</a>
        </div>
      </details>
    </div>`;
  }).join("");

  const sv = saved(g), notes = sv.notes || [], issues = sv.issues || [];
  const agentBox = notes.length || issues.length ? `<div class="box wide agent"><h2><span>From your coding agent</span>${sv.updated ? `<span class="tab">${esc(sv.updated.replace("T", " "))}</span>` : ""}</h2>
    ${notes.length ? `<ul class="pts">${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    ${issues.length ? `<div class="fixes">${issues.map(x => `<div class="fix"><span class="sy">${esc(x.problem)}</span><span class="fx">→ ${esc(x.fix || "not fixed yet")}</span></div>`).join("")}</div>` : ""}</div>` : "";
  const test = g.test.length ? `<div class="box wide"><h2>Test it</h2><div class="term">${g.test.map(l => `<span class="${l.input ? "in" : ""}">${esc(l.text) || "&nbsp;"}</span>`).join("")}</div>${g.testNote ? `<p class="look"><b>Look for:</b> ${g.testNote}</p>` : ""}</div>` : "";
  const fixes = g.fixes.length ? `<div class="box wide"><h2>If you see…</h2><div class="fxlist">${g.fixes.map(f => `<details class="fx"><summary>${f.symptom}</summary><div class="md">${f.html}</div></details>`).join("")}</div></div>` : "";
  const ladder = g.ladder.length ? `<div class="box wide"><h2>Your agent so far</h2><ul class="ladder">${g.ladder.map(l => `<li class="m-${l.mark}"><span class="mk m${l.mark}" aria-label="${["not yet", "partly", "yes"][l.mark]}">${["✗", "◐", "✓"][l.mark]}</span><span>${l.text}</span></li>`).join("")}</ul></div>` : "";


  return `${masthead()}${banner()}
  <div class="crumbs"><nav aria-label="Breadcrumb"><a href="#" data-go="">Overview</a><span>/</span><span>${esc(p.id)} ${esc(p.name)}</span><span>/</span><span>${esc(g.code)}</span></nav>
    <div class="pager"><a class="btn" href="#${prev ? prev.id : ""}" ${prev ? "" : 'aria-disabled="true"'}>← ${prev ? esc(prev.code) : "Prev"}</a><a class="btn" href="#${next ? next.id : ""}" ${next ? "" : 'aria-disabled="true"'}>${next ? esc(next.code) : "Next"} →</a></div></div>
  <header class="head">
    <div class="eyebrow">${esc(g.code)}${g.kind !== "core" ? " · " + KIND[g.kind] : ""}</div>
    <h1>${esc(g.title)}</h1>
    <div class="goal md">${g.mission || g.goal}</div>
    <div class="status">${chip}<span>${why}</span><span class="tab">${tickLine}</span></div>
  </header>
  ${g.prereq ? `<details class="before" ${s === "done" ? "" : "open"}><summary>Before you start: Prerequisites</summary><div class="md">${g.prereq}</div></details>` : ""}
  ${g.takeaways.length ? `<section class="takebox"><h2>You'll leave with</h2><ol class="take">${g.takeaways.map(t => `<li><span>${t}</span></li>`).join("")}</ol></section>` : ""}
  ${g.flow.length ? `<div class="fstrip" role="img" aria-label="How one request flows">${flow}</div>` : ""}
  <section><h2 class="sh"><span>Steps</span><span class="tab">${tickedCount(g)} / ${g.steps.length} done</span></h2>
    <p class="note" style="margin:0 0 10px">Your coding agent ticks steps once it has checked them.${hintStep(g) ? ` Finished one it can't see in your code, like a portal step or a run? Tell it: "mark step ${hintStep(g)} of ${esc(g.code)} done".` : ""}</p>
    <div class="slist">${steps}</div>
    ${g.extras.length ? `<p class="note" style="margin-top:10px">Also in the guide: ${g.extras.join(" · ")}</p>` : ""}</section>
  <div class="boxes">${agentBox}${test}${ladder}${fixes}</div>
  <div class="jump">
    <div class="jl"><span class="jk">Guide</span>${g.guideUrl ? `<a href="${esc(g.guideUrl)}" target="_blank" rel="noopener"><code>${esc(g.guidePath)}</code> ↗</a>` : `<code>${esc(g.guidePath)}</code>`}</div>
  </div>`;
}

function render(keepScroll) {
  const id = location.hash.slice(1), g = byId[id];
  app.innerHTML = g ? exercise(g) : overview();
  document.title = g ? `${g.code} ${g.title} · Workshop Progress` : "Workshop Progress";
  if (!keepScroll) window.scrollTo(0, 0);
}
app.addEventListener("click", e => {
  const a = e.target.closest('[data-go=""]'); if (!a) return;
  e.preventDefault(); history.pushState(null, "", location.pathname); render();
});
window.addEventListener("hashchange", () => render());
window.addEventListener("popstate", () => render());
render();

}
</script>
</body>
</html>
